[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-cartography-reproduction"
version = "0.1.0"
description = "Numerical reproduction of SNLI dataset cartography experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.3,<2.4", "transformers>=4.44,<4.50", "datasets>=3,<5",
  "accelerate>=0.34,<2",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "pyyaml>=6,<7",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
presentation = [
    "python-pptx>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cartography_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
